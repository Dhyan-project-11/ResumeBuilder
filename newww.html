<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South India City Selector</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; line-height: 1.6; }
        .container { max-width: 400px; margin: auto; border: 1px solid #ddd; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }
        select { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; background-color: #fff; cursor: pointer; }
        select:disabled { background-color: #f5f5f5; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="grid-layout">
        <div class="card">
            <h3>Card Title 1</h3>
            <div class="container">
    <h3>Location Selector</h3>
    
    <label for="state">1. Select State</label>
    <select id="state" onchange="updateCities()">
        <option value="" selected disabled>-- Select State --</option>
        <option value="Andhra Pradesh">Andhra Pradesh</option>
        <option value="Karnataka">Karnataka</option>
        <option value="Kerala">Kerala</option>
        <option value="Tamil Nadu">Tamil Nadu</option>
        <option value="Telangana">Telangana</option>
    </select>

    <label for="city">2. Select City</label>
    <select id="city" disabled>
        <option value="" selected disabled>-- Select a State First --</option>
    </select>
</div>
        </div>
        <div class="card">
            <h3>Card Title 2</h3>
            <script>
    // Data object mapping states to major cities
    const cityData = {
        "Andhra Pradesh": ["Visakhapatnam", "Vijayawada", "Guntur", "Nellore", "Tirupati", "Kakinada", "Rajahmundry"],
        "Karnataka": ["Bengaluru", "Mysuru", "Hubballi-Dharwad", "Mangaluru", "Belagavi", "Davangere", "Ballari"],
        "Kerala": ["Thiruvananthapuram", "Kochi", "Kozhikode", "Thrissur", "Kollam", "Palakkad", "Alappuzha"],
        "Tamil Nadu": ["Chennai", "Coimbatore", "Madurai", "Tiruchirappalli", "Salem", "Tirunelveli", "Erode", "Vellore"],
        "Telangana": ["Hyderabad", "Warangal", "Nizamabad", "Khammam", "Karimnagar", "Ramagundam", "Mahabubnagar"]
    };

    function updateCities() {
        const stateSelect = document.getElementById("state");
        const citySelect = document.getElementById("city");
        const selectedState = stateSelect.value;

        // Clear existing options
        citySelect.innerHTML = '<option value="" selected disabled>-- Select City --</option>';

        if (selectedState) {
            citySelect.disabled = false;
            // Add cities for the selected state
            cityData[selectedState].forEach(city => {
                let option = document.createElement("option");
                option.value = city.toLowerCase().replace(/\s+/g, '-');
                option.textContent = city;
                citySelect.appendChild(option);
            });
        } else {
            citySelect.disabled = true;
        }
    }
</script>
        </div>
</body>
</html>
