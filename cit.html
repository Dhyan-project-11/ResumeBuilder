<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f4f9; font-family: 'Inter', sans-serif; }
        .sidebar-gradient { background: white; }
        .card-purple { background: linear-gradient(135deg, #8e2de2, #4a00e0); }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="flex min-h-screen">

    <aside class="w-64 sidebar-gradient border-r border-gray-200 hidden md:block">
        <div class="p-6">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span class="bg-indigo-600 p-1 rounded text-white text-sm">AC</span> Admin
            </h1>
        </div>
        <nav class="mt-6 px-4 space-y-2">
            <a href="#" class="flex items-center gap-4 p-3 text-gray-400 hover:bg-indigo-50 hover:text-indigo-600 rounded-xl transition">
                <i class="fa-solid fa-house"></i> Dashboard
            </a>
            <a href="#" class="flex items-center gap-4 p-3 text-gray-400 hover:bg-indigo-50 hover:text-indigo-600 rounded-xl transition">
                <i class="fa-solid fa-chart-pie"></i> Charts
            </a>
            <a href="#" class="flex items-center gap-4 p-3 text-gray-400 hover:bg-indigo-50 hover:text-indigo-600 rounded-xl transition">
                <i class="fa-solid fa-plug"></i> Plugins
            </a>
        </nav>
    </aside>

    <main class="flex-1 p-8">
        <header class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-gray-800">Dashboard</h2>
            <div class="flex items-center gap-6">
                <div class="relative">
                    <input type="text" placeholder="Search here..." class="pl-10 pr-4 py-2 rounded-full border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-400">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3 text-gray-400"></i>
                </div>
                <button class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-medium shadow-lg hover:bg-indigo-700 transition">
                    Generate Report <i class="fa-solid fa-chart-line ml-2"></i>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="card-purple p-6 rounded-3xl text-white shadow-xl">
                <div class="flex justify-between items-start mb-4">
                    <i class="fa-solid fa-file-invoice text-2xl opacity-80"></i>
                </div>
                <h3 class="text-3xl font-bold">2478</h3>
                <p class="text-sm opacity-80">Total Invoices</p>
            </div>
            
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-start mb-4">
                    <i class="fa-solid fa-circle-check text-2xl text-purple-600"></i>
                </div>
                <h3 class="text-3xl font-bold text-gray-800">983</h3>
                <p class="text-sm text-gray-500">Paid Invoices</p>
            </div>
            </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 bg-white p-8 rounded-[2rem] shadow-sm flex gap-8">
                <div class="w-1/2 card-purple p-8 rounded-[2rem] text-white flex flex-col justify-between">
                    <div>
                        <p class="opacity-80">Wallet Balance</p>
                        <h2 class="text-4xl font-bold mt-2">$824,571.93</h2>
                    </div>
                    <div class="mt-4 text-sm bg-white/20 inline-block px-3 py-1 rounded-full w-max">
                        +0.8% than last week
                    </div>
                </div>
                <div class="w-1/2">
                    <h4 class="font-bold mb-4">Card's Overview</h4>
                    <div class="h-32 w-32 rounded-full border-8 border-indigo-500 border-t-transparent mx-auto"></div>
                </div>
            </div>

            <div class="bg-white p-8 rounded-[2rem] shadow-sm">
                <div class="flex justify-between mb-4">
                    <h4 class="font-bold">Activity</h4>
                    <span class="text-indigo-600 font-bold">$78120</span>
                </div>
                <div class="flex items-end justify-between h-40 gap-2">
                    <div class="w-3 bg-indigo-600 rounded-full h-3/4"></div>
                    <div class="w-3 bg-indigo-200 rounded-full h-1/2"></div>
                    <div class="w-3 bg-indigo-600 rounded-full h-full"></div>
                    <div class="w-3 bg-indigo-600 rounded-full h-2/3"></div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
